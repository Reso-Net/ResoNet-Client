<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
        
        <title>ResoNet-Client</title>
        <link rel="icon" href="./resources/logo.ico">
        <link rel="stylesheet" href="styles/index.css">
        <link rel="stylesheet" href="styles/panels.css">
        <link rel="stylesheet" href="styles/users.css">
        <link rel="stylesheet" href="styles/profile.css">
        <script src="./index.js"></script>

        <template id="userItemTemplate">
            <button class="userItem" onclick="selectUser(this.id)">
                <img class="profilePicture" src="./resources/contacts.svg">
                <div>
                    <p class="status"></p>
                </div>
            </button>
        </template>

        <template id="userWorldItemTemplate">
            <button class="userWorldItem" onclick="console.log('Previewing World: ', this.name)">
                <img class="profilePicture">
                <div>
                    <p></p>
                    <p></p>
                </div>
            </button>
        </template>
    </head>
    
    <body>
        <div id="loginPanel"> 
            <div class="loginPanel">
                <div class="loginBanner">
                    <h2>Login</h2>
                    <img src="./resources/logo.ico">
                </div>
                <input type="text" id="username" placeholder="Username">
                <input type="password" id="password" placeholder="Password">

                <button id="loginButton" onclick="attemptLogin()">Login</button>
            </div>
        </div>

        <div class="page hidden">
            <div class="sideBar">
                <button class="pButton" name="home" onclick="swapPanel(this.name)">
                    <img src="./resources/home.svg">
                </button>
                <button class="pButton" name="contacts" onclick="swapPanel(this.name)">
                    <img src="./resources/contacts.svg">
                </button>
                <button class="pButton" name="worlds" onclick="swapPanel(this.name)">
                    <img src="./resources/public.svg">
                </button>
                <button class="pButton" name="settings" onclick="swapPanel(this.name)">
                    <img src="./resources/settings.svg">
                </button>
            </div>

            <div class="panels">
                <div class="panel" name="home">
                    <div class="subPanel"></div>
                </div>
                <div class="panel hidden" name="contacts">
                    <div id="userSearch">
                        <div class="subPanel">
                            <input type="text" placeholder="Search User..." id="userSearchInput" oninput="filterUsers(this.value)">
                            <button type="submit" id="searchUserbutton" class="hidden" onclick="searchUsers(document.getElementById('userSearchInput').value)">
                                <img src="./resources/search.svg">
                            </button>
                        </div>

                        <div id="userList" class="subPanel"></div>
                    </div>
                    <div id="userProfile">
                        <div class="subPanel" id="profile">
                            <div id="profileInfo">
                                <img class="profilePicture">
                                <p>User Info</p>
                            </div>
                            <div class="hidden" id="badges"></div>
                            <div class="hidden" id="userWorlds">
                                <p>Insert session Item</p>
                            </div>
                        </div>
                        <div class="subPanel" id="actions">
                            <button class="pButton" onclick="addRemoveContact()">Add/Remove Contact</button>
                            <div>
                                <button class="pButton" onclick="blockContact()">Unblock</button>
                                <button class="pButton" onclick="blockAvatar()">Block Avatar</button>
                                <button class="pButton" onclick="blockMutual()">Mutual Block</button>
                            </div>

                        </div>
                    </div>
                    <div class="subPanel" id="userMessages">

                    </div>
                </div>
                <div class="panel hidden" name="worlds">
                    <div class="subPanel">

                    </div>
                </div>
                <div class="panel hidden" name="settings">
                    <div class="subPanel">
                        <p>Settings</p>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
