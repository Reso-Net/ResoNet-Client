<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
        
        <title>ResoNet-Client</title>
        <link rel="icon" href="./resources/logo.ico">
        <link rel="stylesheet" href="styles/index.css">
        <link rel="stylesheet" href="styles/settings.css">
        <link rel="stylesheet" href="styles/panels.css">
        <link rel="stylesheet" href="styles/users.css">
        <link rel="stylesheet" href="styles/profile.css">
        <link rel="stylesheet" href="styles/messages.css">
        <script src="./scripts/settings.js"></script>
        <script src="./scripts/user.js"></script>
        <script src="./scripts/index.js"></script>

        <template id="userItemTemplate">
            <button class="userItem" onclick="selectUser(this.id)">
                <img class="profilePicture" src="./resources/contacts.svg">
                <div>
                    <p class="status"></p>
                </div>
            </button>
        </template>

        <template id="userWorldItemTemplate">
            <button class="userWorldItem" onclick="console.log('Previewing World: ', this.name)">
                <img class="profilePicture">
                <div>
                    <p></p>
                    <p></p>
                </div>
            </button>
        </template>

        <template id="settingItemTemplate">
            <div class="settingItem">
                <label>Setting</label>
                <input type="" name="">
            </div>
        </template>

        <template id="textMessageItemTemplate">
            <div class="userMessageItem" type="Text">
                <p></p>
                <p style="opacity: 50%;"></p>
            </div>
        </template>

        <template id="audioMessageItemTemplate">
            <div class="userMessageItem" type="Audio">
                <audio></audio>
                <button>Play</button>
                <p style="opacity: 50%;"></p>
            </div>
        </template>

        <template id="objectMessageItemTemplate">
            <div class="userMessageItem" type="Object">
                <img>
                <p style="opacity: 50%;"></p>
                <p style="opacity: 50%;"></p>
            </div>
        </template>

        <template id="sessionInviteMessageItemTemplate">
            <div class="userMessageItem SessionInvite" type="SessionInvite">
                <div style="display: flex;"></div>
                <p style="opacity: 50%;"></p>
            </div>
        </template>

        <template id="inviteRequestMessageItemTemplate">
            <div class="userMessageItem" type="InviteRequest">
                <p></p>
                <p style="opacity: 50%;"></p>
            </div>
        </template>
    </head>
    
    <body>
        <div id="loginPanel"> 
            <div class="loginPanel">
                <div class="loginBanner">
                    <h2>Login</h2>
                    <img src="./resources/logo.ico">
                </div>
                <input type="text" id="username" placeholder="Username">
                <input type="password" id="password" placeholder="Password">
                <input type="password" id="totp" placeholder="2FA Code">
                <div>
                    <label>Remember Me</label>
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                </div>

                <div>
                    <label>Auto Login</label>
                    <input type="checkbox" id="autoLogin" name="autoLogin">
                </div>

                <button id="loginButton" onclick="attemptLogin()">Login</button>
            </div>
        </div>

        <div class="page hidden">
            <div class="sideBar">
                <button class="pButton" name="home" onclick="swapPanel(this.name)">
                    <img src="./resources/home.svg">
                </button>
                <button class="pButton" name="contacts" onclick="swapPanel(this.name)">
                    <img src="./resources/contacts.svg">
                </button>
                <button class="pButton" name="worlds" onclick="swapPanel(this.name)">
                    <img src="./resources/public.svg">
                </button>
                <button class="pButton" name="settings" onclick="swapPanel(this.name)">
                    <img src="./resources/settings.svg">
                </button>
            </div>

            <div class="panels">
                <div class="panel" name="home">
                    <div class="subPanel">
                        <p>Not Implemented Yet</p>
                    </div>
                </div>
                <div class="panel hidden" name="contacts">
                    <div id="userSearch">
                        <div class="subPanel">
                            <input type="text" placeholder="Search User..." id="userSearchInput" oninput="filterUsers(this.value)">
                            <button type="submit" id="searchUserbutton" class="hidden" onclick="searchUsers(document.getElementById('userSearchInput').value)">
                                <img src="./resources/search.svg">
                            </button>
                        </div>

                        <div id="userList" class="subPanel"></div>
                    </div>
                    <div id="userProfile">
                        <div class="subPanel" id="profile">
                            <div id="profileInfo">
                                <img class="profilePicture">
                                <p>User Info</p>
                            </div>
                            <div class="hidden" id="badges"></div>
                            <div class="hidden" id="userWorlds">
                                <p>Insert session Item</p>
                            </div>
                        </div>
                        <div class="subPanel" id="actions">
                            <button class="pButton" onclick="addRemoveContact()">Add/Remove Contact</button>
                            <div>
                                <button class="pButton" onclick="blockContact()">Unblock</button>
                                <button class="pButton" onclick="blockAvatar()">Block Avatar</button>
                                <button class="pButton" onclick="blockMutual()">Mutual Block</button>
                            </div>

                        </div>
                    </div>
                    <div class="subPanel" id="userMessagePanel">
                        <div id="userMessages">

                        </div>
                        <div class="subPanel">
                            <input type="text" placeholder="Write a message..." name="userMessageInput" id="userMessageInput" onsubmit="sendMessage(this.value)">
                            <button type="submit" for="userMessageInput" onclick="sendMessage(document.getElementById('userMessageInput').value)">
                                <img src="./resources/send.svg">
                            </button>
                        </div>
                    </div>
                </div>
                <div class="panel hidden" name="worlds">
                    <div class="subPanel">
                        <p>Not Implemented Yet</p>
                    </div>
                </div>
                <div class="panel hidden" name="settings">
                    <div class="subPanel">
                        <h1 id="settingsLabel">
                            Settings
                        </h1>
                        <div id="settings"></div>
                        <div id="settingsActions">
                            <button onclick="saveConfig()">Save Settings</button>
                            <button onclick="resetConfig();">Reset Settings</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
