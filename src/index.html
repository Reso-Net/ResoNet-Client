<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
        
        <title>ResoNet-Client</title>
        <link rel="icon" href="./resources/logo.ico">
        <link rel="stylesheet" href="styles/index.css">
        <link rel="stylesheet" href="styles/panels.css">
        <link rel="stylesheet" href="styles/users.css">
        <script src="./scripts/index.js"></script>

        <template id="userItemTemplate">
            <button class="userItem shadow" >
                <img class="shadow" id="userProfilePicture" src="./resources/contacts.svg">
                <div>
                    <p id="userInfo"></p>
                </div>
            </button>
        </template>
    </head>
    
    <body>
        <div class="loader shadow">Loading...</div>
        <div class="page hidden">
            <div class="sideBar">
                <button class="pButton shadow" name="home">
                    <img src="./resources/home.svg">
                </button>
                <button class="pButton shadow" name="contacts">
                    <img src="./resources/contacts.svg">
                </button>
                <button class="pButton shadow" name="worlds">
                    <img src="./resources/public.svg">
                </button>
                <button class="pButton shadow" name="settings">
                    <img src="./resources/settings.svg">
                </button>
            </div>

            <div class="panels">
                <div class="panel hidden" name="home">
                    <div class="subPanel"></div>
                </div>
                <div class="panel hidden" name="contacts">
                    <div class="subPanel shadow" id="userSearch">
                        <div>
                            <input type="text" placeholder="Search User..." id="userSearchInput" class="shadow">
                            <button type="submit" id="userSearchConfirm"class="shadow">
                                <img src="./resources/search.svg">
                            </button>
                        </div>

                        <div id="contactsList" class="userList active"></div>
                        <div id="userSearchList" class="userList hidden"></div>
                    </div>
                    <div class="subPanel shadow" id="userProfile">

                    </div>
                    <div class="subPanel shadow" id="userMessages">

                    </div>
                </div>
                <div class="panel hidden" name="worlds">
                    <div class="subPanel">

                    </div>
                </div>
                <div class="panel hidden" name="settings">
                    <div class="subPanel">
                        <p>Settings</p>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
