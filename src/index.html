<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
        
        <title>ResoNet-Client</title>
        <link rel="icon" href="./resources/logo.ico">
        <link rel="stylesheet" href="styles/index.css">
        <script src="./scripts/index.js"></script>
    </head>

    <body class="page">
        <div class="sideBar">
            <button class="pButton" name="home">
                <img src="./resources/home.svg">
            </button>
            <button class="pButton" name="contacts">
                <img src="./resources/contacts.svg">
            </button>
            <button class="pButton" name="worlds">
                <img src="./resources/public.svg">
            </button>
            <button class="pButton" name="settings">
                <img src="./resources/settings.svg">
            </button>
        </div>

        <div class="content">
            <div class="panel" name="home">
                <p>Home</p>
            </div>
            <div class="panel hidden" name="contacts">
                <p>Contacts</p>
            </div>
            <div class="panel hidden" name="worlds">
                <p>Worlds</p>
            </div>
            <div class="panel hidden" name="settings">
                <p>Settings</p>
            </div>
        </div>
    </body>
</html>
